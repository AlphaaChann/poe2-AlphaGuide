<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POE2 ALPHACHUU GUIDE — Alpha Ingame Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
:root {
  --bg-deep: #06040d;
  --bg-sidebar: rgba(12, 8, 24, 0.95);
  --bg-panel: rgba(16, 11, 32, 0.85);
  --bg-card: rgba(24, 16, 48, 0.65);
  --gold: #ffb700;
  --gold-glow: rgba(255, 183, 0, 0.4);
  --red: #ff2e63;
  --red-glow: rgba(255, 46, 99, 0.4);
  --cyan: #00f3ff;
  --cyan-glow: rgba(0, 243, 255, 0.4);
  --green: #00ff9d;
  --green-glow: rgba(0, 255, 157, 0.4);
  --purple: #c49aff;
  --violet: #b088ff;
  --violet-glow: rgba(176, 136, 255, 0.45);
  --txt-hi: #ffffff;
  --txt-mid: #d1cae8;
  --txt-dark: #7b739e;
  --bdr: rgba(176, 136, 255, 0.22);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  height: 100vh; width: 100vw; overflow: hidden;
  background: var(--bg-deep); color: var(--txt-mid);
  font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
}

/* NAVBAR */
.app-navbar {
  height: 52px; min-height: 52px;
  background: var(--bg-sidebar); border-bottom: 1px solid var(--bdr);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; z-index: 50; backdrop-filter: blur(16px);
}
.app-brand {
  font-family: 'Orbitron', sans-serif; font-size: 13.5px; font-weight: 800;
  color: var(--violet); letter-spacing: 1.5px; display: flex; align-items: center; gap: 0.6rem;
  text-shadow: 0 0 12px var(--violet-glow);
}
.app-patch-badge {
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--violet);
  background: rgba(176, 136, 255, 0.12); padding: 0.25rem 0.7rem; border-radius: 6px;
  border: 1px solid var(--bdr);
}

/* SYNC BUTTON */
.sync-btn {
  background: linear-gradient(135deg, rgba(176, 136, 255, 0.2) 0%, rgba(176, 136, 255, 0.05) 100%);
  border: 1px solid var(--violet); color: #fff;
  font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
  padding: 0.45rem 1rem; border-radius: 20px; cursor: pointer;
  display: flex; align-items: center; gap: 0.5rem; transition: all 0.25s ease;
  box-shadow: 0 0 10px rgba(176, 136, 255, 0.25);
}
.sync-btn:hover {
  background: var(--violet); color: #06040d;
  box-shadow: 0 0 20px var(--violet-glow);
  transform: translateY(-1px);
}
.sync-btn svg { width: 14px; height: 14px; fill: currentColor; }

/* CONTAINER */
.app-container { flex: 1; display: flex; overflow: hidden; position: relative; }

/* SIDEBAR */
.app-sidebar {
  width: 280px; min-width: 280px; background: var(--bg-sidebar);
  border-right: 1px solid var(--bdr); display: flex; flex-direction: column;
  padding: 1rem 0.75rem; overflow-y: auto; backdrop-filter: blur(12px);
}
.sidebar-title {
  font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800;
  color: var(--violet); letter-spacing: 2px; text-transform: uppercase;
  padding-bottom: 0.6rem; margin-bottom: 0.65rem; border-bottom: 1px solid var(--bdr);
  padding-left: 0.5rem;
}

.char-item {
  display: flex; flex-direction: column; gap: 0.25rem;
  padding: 0.75rem 1rem; margin-bottom: 0.5rem;
  background: rgba(16, 11, 32, 0.5); border: 1px solid rgba(176, 136, 255, 0.1);
  border-radius: 8px; cursor: pointer; transition: all 0.25s ease;
}
.char-item:hover {
  background: rgba(176, 136, 255, 0.08); border-color: rgba(176, 136, 255, 0.3);
}
.char-item.active {
  background: linear-gradient(135deg, rgba(176, 136, 255, 0.22) 0%, rgba(176, 136, 255, 0.05) 100%);
  border-color: var(--violet);
  box-shadow: 0 0 15px rgba(176, 136, 255, 0.2), inset 0 0 10px rgba(176, 136, 255, 0.1);
}
.char-name {
  font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
}
.char-details {
  font-size: 12px; color: var(--txt-dark); display: flex; justify-content: space-between;
}
.active-star { color: var(--gold); text-shadow: 0 0 6px var(--gold-glow); font-size: 13px; }

/* MAIN CONTENT */
.app-main {
  flex: 1; overflow-y: auto; padding: 1.5rem 2rem 4rem;
  display: flex; flex-direction: column; gap: 1.5rem;
}

/* CHARACTER HERO HEADER */
.char-hero {
  background: var(--bg-panel); border: 1px solid var(--bdr);
  border-left: 4px solid var(--violet); border-radius: 12px; padding: 1.5rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
}
.hero-left { display: flex; flex-direction: column; gap: 0.35rem; }
.hero-title {
  font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: #fff;
  text-shadow: 0 0 15px rgba(176, 136, 255, 0.3);
}
.hero-meta { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600; color: var(--violet); }
.hero-meta span { color: #fff; }

.status-badge {
  font-family: 'Share Tech Mono', monospace; font-size: 11px;
  background: rgba(0, 255, 157, 0.12); color: var(--green);
  border: 1px solid rgba(0, 255, 157, 0.3); padding: 0.3rem 0.8rem; border-radius: 20px;
  box-shadow: 0 0 10px rgba(0, 255, 157, 0.15);
}

/* CARDS GRID */
.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;
}

.details-card {
  background: var(--bg-panel); border: 1px solid var(--bdr);
  border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.card-title {
  font-family: 'Orbitron', sans-serif; font-size: 12.5px; font-weight: 800;
  color: var(--violet); letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px dashed rgba(176, 136, 255, 0.2);
  display: flex; align-items: center; gap: 0.5rem;
}

/* SKILLS LIST */
.skills-list { display: flex; flex-direction: column; gap: 0.85rem; }
.skill-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(24, 16, 48, 0.4); border: 1px solid rgba(176, 136, 255, 0.08);
  border-radius: 8px; padding: 0.65rem 1rem; transition: all 0.2s ease;
}
.skill-row:hover {
  background: rgba(24, 16, 48, 0.7); border-color: rgba(176, 136, 255, 0.2);
}
.skill-info { display: flex; align-items: center; gap: 0.85rem; }
.skill-icon {
  width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--bdr);
  background: #111; padding: 2px;
}
.skill-name { font-weight: 600; color: #fff; font-size: 13.5px; }
.skill-dps {
  font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: 700;
  color: var(--green); text-shadow: 0 0 10px rgba(0, 255, 157, 0.25);
}

/* STATS ROW */
.stats-row { display: flex; flex-direction: column; gap: 0.75rem; }
.stat-item {
  display: flex; justify-content: space-between; font-size: 13px;
  border-bottom: 1px solid rgba(176, 136, 255, 0.06); padding-bottom: 0.5rem;
}
.stat-label { color: var(--txt-dark); font-weight: 500; }
.stat-val { color: #fff; font-weight: 600; font-family: 'Share Tech Mono', monospace; }

/* REDIRECT PANEL */
.link-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  width: 100%; padding: 0.85rem; margin-top: 0.85rem;
  background: linear-gradient(135deg, rgba(88, 101, 242, 0.2) 0%, rgba(5, 10, 20, 0.85) 100%);
  border: 1px solid #5865F2; border-radius: 8px; color: #fff;
  font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700;
  text-decoration: none; text-transform: uppercase; cursor: pointer;
  transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.15);
}
.link-btn:hover {
  box-shadow: 0 0 20px rgba(88, 101, 242, 0.45); border-color: #7983f5;
  transform: translateY(-1px);
}
.ninja-btn {
  background: linear-gradient(135deg, rgba(230, 92, 0, 0.2) 0%, rgba(5, 10, 20, 0.85) 100%);
  border-color: #e65c00; box-shadow: 0 4px 15px rgba(230, 92, 0, 0.15);
}
.ninja-btn:hover {
  box-shadow: 0 0 20px rgba(230, 92, 0, 0.45); border-color: #ff7d26;
}

/* LOADER */
.loading-overlay {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1rem; height: 100%; width: 100%; font-family: 'Orbitron', sans-serif;
  color: var(--violet); font-size: 14px;
}
.spinner {
  width: 40px; height: 40px; border: 3px solid rgba(176, 136, 255, 0.1);
  border-top-color: var(--violet); border-radius: 50%;
  animation: spin 1s linear infinite; box-shadow: 0 0 10px rgba(176, 136, 255, 0.2);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Mobile responsiveness */
@media (max-width: 768px) {
  body {
    overflow-y: auto;
    height: auto;
  }
  .app-navbar {
    padding: 0 1rem;
  }
  .app-brand {
    font-size: 12px;
  }
  .app-container {
    flex-direction: column;
    overflow: visible;
    height: auto;
  }
  .app-sidebar {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--bdr);
    max-height: 200px;
    padding: 0.75rem;
  }
  .sidebar-title {
    margin-bottom: 0.4rem;
    padding-bottom: 0.4rem;
  }
  #charListContainer {
    flex-direction: row !important;
    overflow-x: auto;
    gap: 0.5rem !important;
    padding-bottom: 0.25rem;
  }
  .char-item {
    margin-bottom: 0;
    min-width: 200px;
    padding: 0.5rem 0.75rem;
  }
  .char-name {
    font-size: 14px;
  }
  .app-main {
    padding: 1rem 1rem 3rem;
    overflow: visible;
  }
  .char-hero {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.85rem;
    padding: 1.25rem;
  }
  .hero-title {
    font-size: 1.35rem;
  }
  .hero-meta {
    font-size: 13px;
  }
  .cards-grid {
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  .details-card {
    grid-column: span 1 !important;
    padding: 1rem;
  }
}
</style>
</head>
<body>
<canvas id="spaceBgCanvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;opacity:0.65;"></canvas>

  <!-- NAVBAR -->
  <header class="app-navbar">
    <div class="app-brand" onclick="if(window.parent && window.parent.showDashboard) window.parent.showDashboard();" style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;" title="Back to Dashboard">
      <img src="assets/gaming_cheeser_logo.jpg" alt="Logo" style="width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--violet); object-fit: cover;" />
      <span>ALPHA INGAME BUILD</span>
    </div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <button class="sync-btn" onclick="syncProfile()">
        <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        Sync Profile
      </button>
      <span class="app-patch-badge">MrAlphaChuuu-0072</span>
    </div>
  </header>

  <div class="app-container">
    
    <!-- SIDEBAR -->
    <aside class="app-sidebar">
      <h3 class="sidebar-title">Characters</h3>
      <div id="charListContainer" style="display:flex; flex-direction:column; gap:0.25rem;">
        <!-- Hydrated by JS -->
      </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="app-main" id="mainContentPanel">
      <!-- Loading initially -->
      <div class="loading-overlay">
        <div class="spinner"></div>
        <span>Syncing with poe.ninja...</span>
      </div>
    </main>

  </div>

  <script>
    let activeProfileData = [];
    let selectedCharIndex = 0;

    async function loadProfile() {
      const mainPanel = document.getElementById('mainContentPanel');
      mainPanel.innerHTML = `
        <div class="loading-overlay">
          <div class="spinner"></div>
          <span>Loading character build data...</span>
        </div>
      `;

      try {
        // Try fetching dynamically from poe.ninja through CORS proxy or directly
        const res = await fetch('https://poe.ninja/poe2/api/profile/characters/MrAlphaChuuu-0072/0');
        if (!res.ok) throw new Error('API fetch failed');
        activeProfileData = await res.json();
        console.log('Fetched live data from poe.ninja');
      } catch (err) {
        console.warn('CORS or network error. Falling back to local json:', err);
        try {
          const resLocal = await fetch('assets/poe_profile.json');
          activeProfileData = await resLocal.json();
          console.log('Loaded local backup profile data');
        } catch (localErr) {
          console.error('Failed to load local data too:', localErr);
          mainPanel.innerHTML = `<div class="loading-overlay"><span>Failed to load profile data.</span></div>`;
          return;
        }
      }

      renderSidebar();
      renderCharacterDetails(selectedCharIndex);
    }

    function renderSidebar() {
      const container = document.getElementById('charListContainer');
      container.innerHTML = '';

      activeProfileData.forEach((char, index) => {
        const charDiv = document.createElement('div');
        charDiv.className = `char-item ${index === selectedCharIndex ? 'active' : ''}`;
        charDiv.onclick = () => selectCharacter(index);

        const star = char.isCurrent ? '<span class="active-star">★</span>' : '';
        const level = char.level || '??';
        const className = char.className || 'Unknown';
        const leagueName = char.league || 'Standard';

        charDiv.innerHTML = `
          <div class="char-name">
            <span>${char.name}</span>
            ${star}
          </div>
          <div class="char-details">
            <span>Lvl ${level} ${className}</span>
            <span>${leagueName}</span>
          </div>
        `;
        container.appendChild(charDiv);
      });
    }

    function selectCharacter(index) {
      selectedCharIndex = index;
      document.querySelectorAll('.char-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      renderCharacterDetails(index);
    }

    function formatNumber(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      }
      if (num >= 1000) {
        return (num / 1000).toFixed(1) + 'k';
      }
      return num;
    }

    function renderCharacterDetails(index) {
      const char = activeProfileData[index];
      const mainPanel = document.getElementById('mainContentPanel');
      if (!char) {
        mainPanel.innerHTML = '<div class="loading-overlay"><span>No character selected</span></div>';
        return;
      }

      // Generate Skills Markup
      let skillsHtml = '';
      if (!char.skills || char.skills.length === 0) {
        skillsHtml = '<div style="color:var(--txt-dark); text-align:center; padding:2rem 0;">No active skills loaded for this character.</div>';
      } else {
        // Sort skills by damage descending
        const sortedSkills = [...char.skills].sort((a, b) => {
          const dmgA = a.damage ? (a.damage[0] || 0) : 0;
          const dmgB = b.damage ? (b.damage[0] || 0) : 0;
          return dmgB - dmgA;
        });

        sortedSkills.forEach(s => {
          const mainDps = s.damage && s.damage[0] ? s.damage[0] : 0;
          const dpsStr = mainDps > 0 ? `${formatNumber(mainDps)} DPS` : 'Support/Utility';
          skillsHtml += `
            <div class="skill-row">
              <div class="skill-info">
                <img class="skill-icon" src="${s.icon || 'https://web.poecdn.com/gen/image/WzI1LDE0LHsiZiI6IjJESXRlbXMvR2Vtcy9OZXcvQmxhbmtHZW0iLCJ3IjoxLCJoIjoxLCJzY2FsZSI6MSwicmVhbG0iOiJwb2UyIn1d/250ec3ed08/BlankGem.png'}" alt="${s.name}"/>
                <span class="skill-name">${s.name}</span>
              </div>
              <span class="skill-dps">${dpsStr}</span>
            </div>
          `;
        });
      }

      // Generate dates
      const updatedDate = char.updated ? new Date(char.updated).toLocaleString() : 'N/A';

      mainPanel.innerHTML = `
        <!-- Character Hero Header -->
        <div class="char-hero">
          <div class="hero-left">
            <h2 class="hero-title">${char.name}</h2>
            <div class="hero-meta">
              Ascendancy: <span>${char.className || 'Not Configured'}</span> &nbsp;•&nbsp;
              Level: <span>${char.level || '??'}</span> &nbsp;•&nbsp;
              League: <span>${char.league || 'Standard'}</span>
            </div>
          </div>
          ${char.isCurrent ? '<span class="status-badge">CURRENT CHARACTER</span>' : ''}
        </div>

        <!-- Grid of Details -->
        <div class="cards-grid">
          
          <!-- Skills list card -->
          <div class="details-card" style="grid-column: span 2;">
            <h3 class="card-title">🛡️ Active Skills &amp; DPS</h3>
            <div class="skills-list">
              ${skillsHtml}
            </div>
          </div>

          <!-- Build stats & links card -->
          <div class="details-card">
            <h3 class="card-title">⚙️ Metadata &amp; Sync</h3>
            <div class="stats-row">
              <div class="stat-item">
                <span class="stat-label">Account Name</span>
                <span class="stat-val" style="color:var(--violet);">${char.accountName}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Character Name</span>
                <span class="stat-val">${char.name}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">League API Status</span>
                <span class="stat-val" style="color:var(--green);">${char.eligibility ? char.eligibility.type : 'Unknown'}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Last Updated (Ninja)</span>
                <span class="stat-val" style="font-size:12px;">${updatedDate}</span>
              </div>
            </div>

            <div style="margin-top: 1.5rem; display:flex; flex-direction:column; gap:0.5rem;">
              <a href="https://poe.ninja/poe2/profile/MrAlphaChuuu-0072" target="_blank" class="link-btn ninja-btn">
                Open Profile on poe.ninja 🔗
              </a>
              <a href="https://www.pathofexile.com/account/view-profile/MrAlphaChuuu-0072" target="_blank" class="link-btn">
                View Official Path of Exile Profile 🔗
              </a>
            </div>
          </div>

        </div>
      `;
    }

    async function syncProfile() {
      const syncButton = document.querySelector('.sync-btn');
      syncButton.disabled = true;
      syncButton.innerText = 'Syncing...';
      await loadProfile();
      syncButton.disabled = false;
      syncButton.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        Sync Profile
      `;
    }

    // Init
    window.addEventListener('DOMContentLoaded', loadProfile);
  </script>
  <script src="assets/space_background.js"></script>
</body>
</html>
